<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Android Review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 412px; height: 1260px; position: relative; overflow: hidden; background: {{t.surface}}; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; color: {{t.onSurface}}; box-sizing: border-box">
  <div style="padding: 40px 12px 0 16px; display: flex; justify-content: flex-end; align-items: center">
    <a href="AndroidProfile.dc.html" aria-label="Profile" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; text-decoration: none"><span style="width: 40px; height: 40px; border-radius: 20px; background: {{t.primaryContainer}}; color: {{t.onPrimaryContainer}}; display: flex; align-items: center; justify-content: center; font: 700 16px 'Roboto Flex', Roboto, sans-serif">V</span></a>
  </div>
  <h1 style="margin: 4px 16px 14px; font-size: 36px; line-height: 44px; font-weight: 600">Review</h1>

  <div style="margin: 0 16px; display: flex; align-items: center; gap: 8px">
    <div style="display: flex; gap: 2px; width: 168px">
      <button aria-pressed="true" style="flex: 1; height: 40px; border: none; border-radius: 20px 6px 6px 20px; background: {{t.primary}}; color: {{t.onPrimary}}; font: 700 14px 'Roboto Flex', Roboto, sans-serif">Month</button>
      <button style="flex: 1; height: 40px; border: none; border-radius: 6px 20px 20px 6px; background: {{t.secondaryContainer}}; color: {{t.onSecondaryContainer}}; font: 500 14px 'Roboto Flex', Roboto, sans-serif">Year</button>
    </div>
    <div style="flex: 1; display: flex; align-items: center; justify-content: flex-end">
      <button aria-label="Previous month" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: {{t.container}}; color: {{t.onSurface}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span style="padding: 0 8px; font-size: 16px; font-weight: 700">Nov 2026</span>
      <button aria-label="Next month" disabled style="width: 44px; height: 44px; border: none; border-radius: 22px; background: {{t.container}}; color: {{t.disabled}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </div>

  <div style="margin: 14px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{tiles}}" as="k" hint-placeholder-count="4">
      <div style="height: 150px; border-radius: 28px; background: {{k.hero}}; padding: 14px 16px; box-sizing: border-box; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: {{k.txt}}">
          <span style="width: 30px; height: 30px; border-radius: 15px; background: {{k.badge}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{k.icon}}"/></svg></span>{{k.label}}</div>
        <div style="margin-top: auto"><span style="font-size: 28px; font-weight: 800; letter-spacing: -0.5px">{{k.value}}</span><span style="font-size: 13px; color: {{t.onSurfaceVariant}}"> {{k.unit}}</span></div>
        <svg width="148" height="12" viewBox="0 0 148 12" aria-hidden="true" style="display: block; margin-top: 6px"><polyline fill="none" stroke="{{k.color}}" stroke-width="5" stroke-linecap="round" points="{{k.wave}}"/><line x1="{{k.trackX}}" y1="6" x2="145" y2="6" stroke="{{k.badge}}" stroke-width="5" stroke-linecap="round"/></svg>
      </div>
    </sc-for>
  </div>
  <div style="margin: 8px 20px 0; font-size: 12px; color: {{t.onSurfaceVariant}}">Daily averages from WHOOP</div>

  <section style="margin: 12px 16px 0; background: {{t.hero.weight}}; border-radius: 32px; padding: 16px 18px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: {{t.badge.weight}}; color: {{t.txt.weight}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8.5 9.5a5 5 0 0 1 7 0M12 10l1.3-1.8"/></svg></span>
      <div style="flex: 1"><div style="font-size: 16px; font-weight: 600; color: {{t.txt.weight}}">Weight</div><div style="font-size: 13px; color: {{t.onSurfaceVariant}}">80.2 → 78.4 kg · 14 weigh-ins</div></div>
      <span style="background: {{t.weightStrong}}; color: #FFFFFF; font-size: 16px; font-weight: 700; padding: 6px 12px; border-radius: 999px">−1.8 kg</span>
    </div>
    <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="aspect-ratio: 4 / 3; border-radius: 24px 10px 10px 24px; background: {{t.ph1}}; position: relative; display: flex; align-items: center; justify-content: center; color: {{t.onSurfaceVariant}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg><span style="position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,0.62); color: #FFFFFF; font: 700 12px 'Roboto Flex', Roboto, sans-serif; padding: 3px 8px; border-radius: 999px">2 Nov · 80.2</span></div>
      <div style="aspect-ratio: 4 / 3; border-radius: 10px 24px 24px 10px; background: {{t.ph2}}; position: relative; display: flex; align-items: center; justify-content: center; color: {{t.onSurfaceVariant}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg><span style="position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,0.62); color: #FFFFFF; font: 700 12px 'Roboto Flex', Roboto, sans-serif; padding: 3px 8px; border-radius: 999px">26 Nov · 78.4</span></div>
    </div>
  </section>

  <section style="margin: 8px 16px 0; background: {{t.hero.food}}; border-radius: 32px; padding: 16px 18px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: {{t.badge.food}}; color: {{t.txt.food}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v5a2 2 0 0 0 4 0V3M7 3v18M17 3c-2 1.5-2.5 4-2.5 7H17v11"/></svg></span>
      <div style="flex: 1"><div style="font-size: 16px; font-weight: 600; color: {{t.txt.food}}">Food</div><div style="font-size: 13px; color: {{t.onSurfaceVariant}}">Days with photos</div></div>
      <span><span style="font-size: 22px; font-weight: 800">22</span><span style="font-size: 13px; color: {{t.onSurfaceVariant}}"> / 26</span></span>
    </div>
    <div role="img" aria-label="Days with food photos in November: 22 of 26" style="margin-top: 12px; display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 5px">
      <sc-for list="{{foodDots}}" as="f" hint-placeholder-count="26">
        <span style="aspect-ratio: 1 / 1; border-radius: 999px; background: {{f.c}}"></span>
      </sc-for>
    </div>
  </section>

  <a href="AndroidTrainerLink.dc.html" style="margin: 14px 16px 0; height: 64px; border-radius: 32px; background: {{t.primary}}; color: {{t.onPrimary}}; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 700">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Share with trainer</a>

  <h2 style="margin: 18px 16px 8px; font-size: 22px; line-height: 28px; font-weight: 600">Active links</h2>
  <div style="margin: 0 16px; display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{links}}" as="l" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 0 8px 0 12px; border-radius: 24px; background: {{t.container}}">
        <span style="width: 44px; height: 44px; border-radius: 22px; background: {{t.tertiaryContainer}}; color: {{t.onTertiaryContainer}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">T</span>
        <div style="flex: 1; min-width: 0"><div style="font-size: 16px; font-weight: 600">[Trainer name]</div><div style="font-size: 13px; color: {{t.onSurfaceVariant}}">{{l.meta}}</div></div>
        <button style="height: 40px; padding: 0 14px; border: none; border-radius: 20px; background: {{t.errorContainer}}; color: {{t.onErrorContainer}}; font: 700 14px 'Roboto Flex', Roboto, sans-serif">Revoke</button>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: {{t.container}}; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding-bottom: 8px; box-sizing: border-box">
    <a href="AndroidActivity.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{t.onSurfaceVariant}}; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4.5" r="2"/><path d="M9 21l2-6 3 3v3M7 12l2-4 4 1 2 3 3 1"/></svg></span>Activity</a>
    <a href="AndroidWeight.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{t.onSurfaceVariant}}; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8.5 9.5a5 5 0 0 1 7 0M12 10l1.3-1.8"/></svg></span>Weight</a>
    <a href="AndroidFood.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{t.onSurfaceVariant}}; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v5a2 2 0 0 0 4 0V3M7 3v18M17 3c-2 1.5-2.5 4-2.5 7H17v11"/></svg></span>Food</a>
    <a href="AndroidReview.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{t.onSurface}}; font-size: 12px; font-weight: 700"><span style="width: 56px; height: 32px; border-radius: 16px; background: {{t.secondaryContainer}}; color: {{t.onSecondaryContainer}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg></span>Review</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":412,"height":1260}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    const G = { steps: '#FF9500', strain: '#FA114F', recovery: '#34C759', sleep: '#8E5CF7', weight: '#0A84FF', food: '#FFB000' };
    const rgba = (h, a) => 'rgba(' + parseInt(h.slice(1, 3), 16) + ',' + parseInt(h.slice(3, 5), 16) + ',' + parseInt(h.slice(5, 7), 16) + ',' + a + ')';
    const badge = {}; Object.keys(G).forEach((k) => { badge[k] = rgba(G[k], dark ? 0.26 : 0.18); });
    const t = Object.assign(dark ? {
      surface: '#111318', container: '#1D2024', onSurface: '#E2E2E9', onSurfaceVariant: '#C4C6D0', disabled: '#5C5F66',
      primary: '#AAC7FF', onPrimary: '#0A305F', primaryContainer: '#284777', onPrimaryContainer: '#D6E3FF', secondaryContainer: '#3E4759', onSecondaryContainer: '#DAE2F9',
      tertiaryContainer: '#573E5C', onTertiaryContainer: '#FAD8FD', errorContainer: '#93000A', onErrorContainer: '#FFDAD6', ph1: '#282A2F', ph2: '#33353A', weightStrong: '#0A6FE0',
      txt: { steps: '#FF9F0A', strain: '#FF375F', recovery: '#30D158', sleep: '#A48BFF', weight: '#409CFF', food: '#FFC23D' },
      hero: { steps: '#33230F', strain: '#36141F', recovery: '#14301F', sleep: '#261E3B', weight: '#13263F', food: '#352A10' }
    } : {
      surface: '#F9F9FF', container: '#EDEDF4', onSurface: '#191C20', onSurfaceVariant: '#44474E', disabled: '#AEB0B8',
      primary: '#415F91', onPrimary: '#FFFFFF', primaryContainer: '#D6E3FF', onPrimaryContainer: '#001B3E', secondaryContainer: '#DAE2F9', onSecondaryContainer: '#131C2B',
      tertiaryContainer: '#FAD8FD', onTertiaryContainer: '#29132D', errorContainer: '#FFDAD6', onErrorContainer: '#410002', ph1: '#E2E2E9', ph2: '#D8D9E0', weightStrong: '#0062CC',
      txt: { steps: '#B25E00', strain: '#C8003C', recovery: '#1E7B34', sleep: '#6A3BD1', weight: '#0062CC', food: '#946200' },
      hero: { steps: '#FFEBD1', strain: '#FFE1E8', recovery: '#DDF5E4', sleep: '#ECE5FF', weight: '#DDEBFF', food: '#FFF0CF' }
    }, { badge });
    const wave = (len) => { const p = []; for (let x = 3; x <= len; x += 2) p.push(x + ',' + (6 + 3 * Math.sin(x / 4.5)).toFixed(1)); return p.join(' '); };
    const tile = (k, label, value, unit, frac, icon) => {
      const len = Math.max(6, Math.round(142 * frac));
      return { label, value, unit, icon, hero: t.hero[k], txt: t.txt[k], badge: t.badge[k], color: G[k], wave: wave(len), trackX: Math.min(145, len + 6) };
    };
    const foodDots = Array.from({ length: 26 }, (_, i) => ({ c: [5, 12, 19, 21].indexOf(i) >= 0 ? t.badge.food : G.food }));
    return {
      t, foodDots,
      tiles: [
        tile('steps', 'Steps', '7,860', '/ day', 0.79, 'M13 4.5a2 2 0 1 0 0 .01M9 21l2-6 3 3v3M7 12l2-4 4 1 2 3 3 1'),
        tile('strain', 'Strain', '11.2', 'of 21', 11.2 / 21, 'M3 12h4l3-8 4 16 3-8h4'),
        tile('recovery', 'Recovery', '61', '%', 0.61, 'M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z'),
        tile('sleep', 'Sleep', '7 h 24', '', 7.4 / 9, 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z')
      ],
      links: [{ meta: 'November 2026 · expires 31 Dec' }, { meta: 'Year 2026 · no expiry' }]
    };
  }
}
</script>
</body>
</html>
