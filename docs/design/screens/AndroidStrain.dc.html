<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Android Strain detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 412px; height: 1070px; position: relative; overflow: hidden; background: {{t.surface}}; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; color: {{t.onSurface}}; box-sizing: border-box">
  <div style="padding: 40px 4px 0; display: flex; align-items: center; gap: 4px; height: 104px; box-sizing: border-box">
    <a href="AndroidActivity.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: {{t.onSurface}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
    <div>
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">Strain</h1>
      <div style="font-size: 13px; color: {{t.onSurfaceVariant}}">Thursday, 26 November</div>
    </div>
  </div>

  <section style="margin: 4px 16px 0; background: {{t.hero.strain}}; border-radius: 36px; padding: 20px">
    <div style="display: flex; align-items: center; gap: 16px">
      <svg width="168" height="168" viewBox="0 0 168 168" role="img" aria-label="Day strain 11.8 of 21">
        <circle cx="84" cy="84" r="68" fill="none" stroke="{{t.badge.strain}}" stroke-width="14"/>
        <polyline fill="none" stroke="#FA114F" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" points="{{ring}}"/>
        <text x="84" y="92" text-anchor="middle" font-size="45" font-weight="800" fill="{{t.onSurface}}" font-family="'Roboto Flex', Roboto, sans-serif">11.8</text>
        <text x="84" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="{{t.onSurfaceVariant}}" font-family="'Roboto Flex', Roboto, sans-serif">of 21</text>
      </svg>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
        <span style="background: #FA114F; color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px">Moderate</span>
        <div style="font-size: 14px; line-height: 20px; color: {{t.onSurface}}">Above your 7-day average of <b>11.6</b></div>
      </div>
    </div>
    <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{pills}}" as="p" hint-placeholder-count="3">
        <div style="background: {{t.surface}}; border-radius: 20px; padding: 10px 12px">
          <div style="font-size: 12px; font-weight: 700; color: {{p.color}}">{{p.label}}</div>
          <div><span style="font-size: 22px; font-weight: 800">{{p.value}}</span><span style="font-size: 12px; color: {{t.onSurfaceVariant}}"> {{p.unit}}</span></div>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="margin: 8px 16px 0; background: {{t.hero.steps}}; border-radius: 28px; padding: 16px 20px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: {{t.badge.steps}}; color: {{t.txt.steps}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4.5" r="2"/><path d="M9 21l2-6 3 3v3M7 12l2-4 4 1 2 3 3 1"/></svg></span>
      <span style="flex: 1; font-size: 16px; font-weight: 600; color: {{t.txt.steps}}">Steps</span>
      <span><span style="font-size: 22px; font-weight: 800">7,235</span><span style="font-size: 13px; color: {{t.onSurfaceVariant}}"> / 10,000</span></span>
    </div>
    <svg width="332" height="14" viewBox="0 0 332 14" aria-hidden="true" style="display: block; margin-top: 10px"><polyline fill="none" stroke="#FF9500" stroke-width="6" stroke-linecap="round" points="{{stepsWave}}"/><line x1="248" y1="7" x2="328" y2="7" stroke="{{t.badge.steps}}" stroke-width="6" stroke-linecap="round"/></svg>
  </section>

  <section style="margin: 8px 16px 0; background: {{t.container}}; border-radius: 28px; padding: 16px">
    <div style="display: flex; gap: 2px">
      <button aria-pressed="true" style="flex: 1; height: 40px; border: none; border-radius: 20px 6px 6px 20px; background: #FA114F; color: #FFFFFF; font: 700 14px 'Roboto Flex', Roboto, sans-serif">Week</button>
      <button style="flex: 1; height: 40px; border: none; border-radius: 6px; background: {{t.secondaryContainer}}; color: {{t.onSecondaryContainer}}; font: 500 14px 'Roboto Flex', Roboto, sans-serif">Month</button>
      <button style="flex: 1; height: 40px; border: none; border-radius: 6px 20px 20px 6px; background: {{t.secondaryContainer}}; color: {{t.onSecondaryContainer}}; font: 500 14px 'Roboto Flex', Roboto, sans-serif">Year</button>
    </div>
    <div role="img" aria-label="Day strain for the last 7 days" style="margin-top: 16px; height: 120px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); align-items: end; gap: 8px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
          <span style="font-size: 12px; font-weight: 700; color: {{b.vColor}}; background: {{b.vBg}}; padding: 2px 5px; border-radius: 8px">{{b.v}}</span>
          <div style="width: 100%; height: {{b.h}}px; border-radius: 999px; background: {{b.c}}"></div>
        </div>
      </sc-for>
    </div>
    <div style="margin-top: 6px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; text-align: center">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
        <span style="font-size: 12px; font-weight: {{b.weight}}; color: {{b.label}}">{{b.d}}</span>
      </sc-for>
    </div>
  </section>

  <h2 style="margin: 18px 16px 8px; font-size: 22px; line-height: 28px; font-weight: 600">Today's workouts</h2>
  <div style="margin: 0 16px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{workouts}}" as="w" hint-placeholder-count="2">
      <div style="background: {{t.container}}; border-radius: 24px; padding: 12px 16px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 40px; height: 40px; border-radius: 20px; background: {{t.badge.strain}}; color: {{t.txt.strain}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l3 7M13 5h2"/></svg></span>
          <div style="flex: 1; min-width: 0"><div style="font-size: 16px; font-weight: 600">{{w.name}}</div><div style="font-size: 13px; color: {{t.onSurfaceVariant}}">{{w.meta}}</div></div>
          <span style="background: #FA114F; color: #FFFFFF; font-size: 14px; font-weight: 700; padding: 6px 10px; border-radius: 999px">{{w.strain}}</span>
        </div>
        <div role="img" aria-label="Time in heart rate zones 1 to 5" style="margin-top: 10px; display: flex; gap: 3px; height: 10px">
          <sc-for list="{{w.zones}}" as="z" hint-placeholder-count="5"><span style="width: {{z.w}}%; border-radius: 5px; background: {{z.c}}"></span></sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: {{t.container}}; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding-bottom: 8px; box-sizing: border-box">
    <a href="AndroidActivity.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{t.onSurface}}; font-size: 12px; font-weight: 700"><span style="width: 56px; height: 32px; border-radius: 16px; background: {{t.secondaryContainer}}; color: {{t.onSecondaryContainer}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4.5" r="2"/><path d="M9 21l2-6 3 3v3M7 12l2-4 4 1 2 3 3 1"/></svg></span>Activity</a>
    <a href="AndroidWeight.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{t.onSurfaceVariant}}; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8.5 9.5a5 5 0 0 1 7 0M12 10l1.3-1.8"/></svg></span>Weight</a>
    <a href="AndroidFood.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{t.onSurfaceVariant}}; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v5a2 2 0 0 0 4 0V3M7 3v18M17 3c-2 1.5-2.5 4-2.5 7H17v11"/></svg></span>Food</a>
    <a href="AndroidReview.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{t.onSurfaceVariant}}; font-size: 12px; font-weight: 500"><span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg></span>Review</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":412,"height":1070}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    const G = { steps: '#FF9500', strain: '#FA114F', recovery: '#34C759', sleep: '#8E5CF7', heart: '#FF3B30', weight: '#0A84FF', food: '#FFB000' };
    const rgba = (h, a) => 'rgba(' + parseInt(h.slice(1, 3), 16) + ',' + parseInt(h.slice(3, 5), 16) + ',' + parseInt(h.slice(5, 7), 16) + ',' + a + ')';
    const badge = {}; Object.keys(G).forEach((k) => { badge[k] = rgba(G[k], dark ? 0.26 : 0.18); });
    const t = Object.assign(dark ? {
      surface: '#111318', container: '#1D2024', onSurface: '#E2E2E9', onSurfaceVariant: '#C4C6D0', outlineVariant: '#44474E',
      secondaryContainer: '#3E4759', onSecondaryContainer: '#DAE2F9',
      txt: { steps: '#FF9F0A', strain: '#FF375F', recovery: '#30D158', sleep: '#A48BFF', heart: '#FF453A', weight: '#409CFF', food: '#FFC23D' },
      hero: { steps: '#33230F', strain: '#36141F', recovery: '#14301F', sleep: '#261E3B', weight: '#13263F', food: '#352A10' }
    } : {
      surface: '#F9F9FF', container: '#EDEDF4', onSurface: '#191C20', onSurfaceVariant: '#44474E', outlineVariant: '#C4C6D0',
      secondaryContainer: '#DAE2F9', onSecondaryContainer: '#131C2B',
      txt: { steps: '#B25E00', strain: '#C8003C', recovery: '#1E7B34', sleep: '#6A3BD1', heart: '#C9201A', weight: '#0062CC', food: '#946200' },
      hero: { steps: '#FFEBD1', strain: '#FFE1E8', recovery: '#DDF5E4', sleep: '#ECE5FF', weight: '#DDEBFF', food: '#FFF0CF' }
    }, { badge });
    const pts = [];
    for (let i = 0; i <= Math.round(360 * 11.8 / 21); i += 2) {
      const a = (-90 + i) * Math.PI / 180;
      const r = 68 + 3.2 * Math.sin(i * Math.PI / 180 * 14);
      pts.push((84 + r * Math.cos(a)).toFixed(1) + ',' + (84 + r * Math.sin(a)).toFixed(1));
    }
    const sw = [];
    for (let x = 3; x <= 240; x += 2) sw.push(x + ',' + (7 + 3.5 * Math.sin(x / 5)).toFixed(1));
    const letters = ['F', 'S', 'S', 'M', 'T', 'W', 'T'];
    const strain = [13.2, 15.8, 6.4, 10.9, 14.1, 8.7, 11.8];
    const bars = strain.map((v, i) => ({
      d: letters[i], v: v.toFixed(1), h: Math.round(v / 21 * 96),
      c: i === 6 ? '#FA114F' : rgba(G.strain, 0.42),
      vColor: i === 6 ? '#FFFFFF' : t.onSurfaceVariant, vBg: i === 6 ? '#FA114F' : 'transparent',
      weight: i === 6 ? 800 : 500, label: i === 6 ? t.onSurface : t.onSurfaceVariant
    }));
    const zoneC = (i) => rgba(G.heart, 0.3 + i * 0.17);
    return {
      t, ring: pts.join(' '), stepsWave: sw.join(' '), bars,
      pills: [
        { label: 'Calories', value: '2,150', unit: 'kcal', color: t.txt.strain },
        { label: 'Avg HR', value: '74', unit: 'bpm', color: t.txt.heart },
        { label: 'Max HR', value: '152', unit: 'bpm', color: t.txt.heart }
      ],
      workouts: [
        { name: 'Outdoor cycling', strain: '9.4', meta: '7:10 AM · 35 min · avg 138 bpm', zones: [10, 22, 38, 22, 8].map((w, i) => ({ w, c: zoneC(i) })) },
        { name: 'Walking', strain: '3.1', meta: '12:40 PM · 22 min · avg 101 bpm', zones: [45, 40, 15, 0, 0].map((w, i) => ({ w, c: zoneC(i) })) }
      ]
    };
  }
}
</script>
</body>
</html>
